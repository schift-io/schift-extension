<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Local APM authoring for Codex and Claude." />
    <title>Schift APM Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="desk">
      <section class="source-panel" aria-label="Source input">
        <p class="panel-index">01 / SOURCE</p>
        <button id="source-dropzone" class="drop-zone" type="button">
          <span class="drop-mark">+</span>
          <span><b>Drop a source file</b><small>SKILL.md · AGENTS.md · agent.md</small></span>
        </button>
        <input id="source-file" type="file" accept=".md,text/markdown" hidden />
        <p id="source-state" class="source-state">NO SOURCE / NEW PACK</p>
        <label class="path-field">
          <span>or paste a local path</span>
          <input name="source" form="pack-form" placeholder="/path/to/SKILL.md" />
        </label>
        <section class="pack-inventory" aria-label="Local APMs">
          <div class="inventory-heading"><span>LOCAL APMS</span><button id="new-pack" type="button">New APM</button></div>
          <div id="pack-list" class="pack-list"><p class="inventory-empty">No local APMs yet.</p></div>
        </section>
      </section>

      <section class="build-panel" aria-label="Pack configuration">
        <p class="panel-index">02 / CONFIGURE</p>
        <form id="pack-form">
          <label>
            <span>Pack ID</span>
            <input name="name" value="my-workflow" required pattern="[a-z0-9-]+" />
          </label>
          <label>
            <span>Purpose</span>
            <textarea name="purpose" required>Draft a reviewable response from company evidence.</textarea>
          </label>
          <label>
            <span>Host model</span>
            <select name="model">
              <option value="openai/gpt-5.4-mini">Codex / GPT-5.4 mini</option>
              <option value="anthropic/claude-sonnet">Claude Sonnet</option>
              <option value="google/gemini-3-flash">Gemini Flash</option>
            </select>
          </label>
          <fieldset>
            <legend>Capabilities</legend>
            <div class="capability-grid">
              <label class="capability">
                <input type="checkbox" name="connector" value="schift-memory" checked />
                <span class="check">✓</span>
                <span><b>Memory read</b><small>Search and cite Schift evidence</small></span>
              </label>
              <label class="capability">
                <input type="checkbox" name="connector" value="schift-write" />
                <span class="check">✓</span>
                <span><b>Approved write</b><small>Store only after explicit approval</small></span>
              </label>
              <label class="capability">
                <input type="checkbox" name="connector" value="local-model" checked />
                <span class="check">✓</span>
                <span><b>Host subscription</b><small>Claude or Codex runs the model</small></span>
              </label>
            </div>
          </fieldset>
          <button type="submit"><span>Build APM</span><b>Enter ↵</b></button>
        </form>
      </section>

      <aside class="graph-panel" aria-label="APM runtime graph">
        <p class="panel-index">03 / RUNTIME</p>
        <svg id="capability-graph" viewBox="0 0 800 620" role="img" aria-labelledby="svg-title svg-description">
          <title id="svg-title">APM runtime graph</title>
          <desc id="svg-description">The local host runs the APM and model. The Schift connector provides evidence retrieval and optional approved write-back.</desc>
          <defs>
            <pattern id="dot-grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" /></pattern>
            <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" /></marker>
          </defs>
          <rect class="svg-grid" x="0" y="0" width="800" height="620" rx="8" />
          <g class="svg-lane"><line x1="34" y1="64" x2="766" y2="64" /><text x="36" y="42">LOCAL HOST</text><line x1="34" y1="356" x2="766" y2="356" /><text x="36" y="334">SCHIFT DATA PLANE</text></g>
          <g class="svg-flow"><path d="M258 196 C310 196 314 150 350 150" marker-end="url(#arrow)" /><path d="M450 150 C492 150 500 196 542 196" marker-end="url(#arrow)" /><path d="M400 220 L400 406" marker-end="url(#arrow)" /><path id="memory-flow" d="M350 470 C302 470 296 510 258 510" marker-end="url(#arrow)" /><path id="write-flow" d="M450 470 C498 470 504 510 542 510" marker-end="url(#arrow)" /></g>
          <g class="graph-node graph-node--host"><rect x="58" y="132" width="200" height="128" rx="8" /><text class="node-kicker" x="80" y="166">SOURCE</text><text id="svg-host" class="node-title" x="80" y="198">New pack</text><text id="svg-source-detail" class="node-detail" x="80" y="228">no imported skill</text></g>
          <g class="graph-node graph-node--apm"><rect x="350" y="86" width="100" height="134" rx="8" /><text class="node-kicker" x="370" y="122">PACK</text><text class="node-title" x="370" y="158">APM</text><text class="node-detail" x="370" y="188">policy</text></g>
          <g class="graph-node graph-node--model"><rect x="542" y="132" width="200" height="128" rx="8" /><text class="node-kicker" x="564" y="166">MODEL</text><text id="svg-model" class="node-title" x="564" y="198">GPT-5.4 mini</text><text class="node-detail" x="564" y="228">host subscription</text></g>
          <g class="graph-node graph-node--connector"><rect x="300" y="406" width="200" height="118" rx="8" /><text class="node-kicker" x="322" y="440">CONNECTOR</text><text id="svg-connector" class="node-title" x="322" y="472">Schift MCP</text><text id="svg-scope" class="node-detail" x="322" y="500">read only</text></g>
          <g id="memory-node" class="graph-node graph-node--memory"><rect x="58" y="454" width="200" height="116" rx="8" /><text class="node-kicker" x="80" y="488">RECALL</text><text id="svg-memory" class="node-title" x="80" y="520">Memory</text><text class="node-detail" x="80" y="546">search · cite</text></g>
          <g id="write-node" class="graph-node graph-node--write is-disabled"><rect x="542" y="454" width="200" height="116" rx="8" /><text class="node-kicker" x="564" y="488">WRITE-BACK</text><text class="node-title" x="564" y="520">Approved facts</text><text id="svg-write-detail" class="node-detail" x="564" y="546">not connected</text></g>
        </svg>
        <div class="graph-readout" aria-live="polite"><p><span>PURPOSE</span><strong id="graph-purpose">Reviewable evidence response</strong></p><p><span>SCOPE</span><strong id="graph-tools">Memory read</strong></p></div>
      </aside>
    </main>
    <section id="result" class="result is-empty" aria-live="polite"><p>READY</p><span>Drop a source or configure a new pack.</span></section>
    <script type="module" src="/app.js"></script>
  </body>
</html>
